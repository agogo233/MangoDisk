id = "browser.chrome-cache"
schema_version = 3
rule_version = 3
platform = "macos"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["Google Chrome"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.google.Chrome", "Google Chrome"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/Google/Chrome"

[[roots]]
template = "${application_support}/Google/Chrome/ShaderCache"

[[roots]]
template = "${application_support}/Google/Chrome/GrShaderCache"

[[roots]]
template = "${application_support}/Google/Chrome/GraphiteDawnCache"

[[roots]]
template = "${application_support}/Google/Chrome/GPUPersistentCache"

[[roots]]
template = "${application_support}/Google/Chrome"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "GrShaderCache", "DawnWebGPUCache", "DawnGraphiteCache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Official Chromium sources identify disposable cache leaves. Isolated scan, dry-run, deletion, and preservation tests cover these roots; credentials, history, extensions, and site storage are excluded."
verified_at = "2026-10-20"
verified_platform = "macos"
references = [
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
  "https://support.google.com/accounts/answer/32050",
  "https://chromium.googlesource.com/chromium/src/+/main/chrome/browser/chrome_content_browser_client.cc",
  "https://chromium.googlesource.com/chromium/src/+/main/gpu/ipc/common/gpu_disk_cache_type.cc",
]
