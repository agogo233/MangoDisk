id = "browser.brave-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["Brave Browser"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.brave.Browser", "Brave"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/BraveSoftware/Brave-Browser"

[[roots]]
template = "${application_support}/BraveSoftware/Brave-Browser/ShaderCache"

[[roots]]
template = "${application_support}/BraveSoftware/Brave-Browser/GrShaderCache"

[[roots]]
template = "${application_support}/BraveSoftware/Brave-Browser/GraphiteDawnCache"

[[roots]]
template = "${application_support}/BraveSoftware/Brave-Browser/GPUPersistentCache"

[[roots]]
template = "${application_support}/BraveSoftware/Brave-Browser"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "GrShaderCache", "DawnWebGPUCache", "DawnGraphiteCache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Official Chromium sources identify disposable cache leaves. Isolated scan, dry-run, deletion, and preservation tests cover these roots; credentials, history, extensions, and site storage are excluded."
verified_at = "2026-10-20"
verified_platform = "macos"
references = [
  "https://support.brave.com/hc/en-us/articles/360017903152-How-Do-I-Clear-Cookies-And-Site-Data-In-Brave",
  "https://chromium.googlesource.com/chromium/src/+/main/chrome/browser/chrome_content_browser_client.cc",
  "https://chromium.googlesource.com/chromium/src/+/main/gpu/ipc/common/gpu_disk_cache_type.cc",
]
