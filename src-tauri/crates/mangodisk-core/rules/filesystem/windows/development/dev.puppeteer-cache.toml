id = "dev.puppeteer-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "development"
risk = "recoverable"
default_selected = false
recommended_selected = false
required_stopped_processes = ["node.exe", "chrome.exe", "chrome-headless-shell.exe", "firefox.exe"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${home}/.cache/puppeteer/chrome"

[[roots]]
template = "${home}/.cache/puppeteer/chrome-headless-shell"

[[roots]]
template = "${home}/.cache/puppeteer/firefox"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Puppeteer documents downloaded browser stores and the browsers install recovery command. Windows isolated scan, dry-run, deletion, and ownership tests cover only named stores; project configuration, sibling data, and custom cache paths are excluded."
verified_at = "2026-10-21"
verified_platform = "windows"
references = [
  "https://pptr.dev/guides/configuration",
  "https://pptr.dev/browsers-api/browsers.browser",
]
