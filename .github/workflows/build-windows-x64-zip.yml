name: Build Windows x64 ZIP

on:
  # Manual trigger for on-demand artifact builds, plus every push to main so
  # the artifact stays fresh. The cross-platform check workflow handles the
  # full test-and-lint gate on pull requests.
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        # pnpm/action-setup reads the packageManager field from package.json.
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri 2 does not ship a zip bundle target. Build the binary without
      # packaging (`--no-bundle`), then assemble a portable zip from the
      # release output (exe + runtime DLLs).
      - name: Build x64 ZIP bundle
        run: |
          pnpm tauri:build -- --no-bundle
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $src = "src-tauri/target/release"
          $pkgDir = Join-Path $src "MangoDisk"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item -Path "$src\MangoDisk.exe" -Destination $pkgDir
          Copy-Item -Path "$src\*.dll" -Destination $pkgDir -ErrorAction SilentlyContinue
          $zipName = "MangoDisk-x64-$version.zip"
          Compress-Archive -Path $pkgDir\* -DestinationPath (Join-Path $src $zipName)
        shell: powershell

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangodisk-win-x64-${{ github.ref_name }}-${{ github.sha }}
          path: src-tauri/target/release/*.zip
          if-no-files-found: error
